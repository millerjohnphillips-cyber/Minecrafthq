<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111922">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Minecraft HQ">
<link rel="manifest" href="manifest.json">
<title>Minecraft HQ</title>
<style>
:root{--bg:#101820;--panel:#18242e;--panel2:#22323e;--text:#edf5f8;--muted:#a9bac5;--accent:#49c9d7;--border:#334752;--danger:#f17b72;--good:#7edb9a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:calc(78px + env(safe-area-inset-bottom))}
body.light{--bg:#eef4f4;--panel:#fff;--panel2:#e3eeee;--text:#14232b;--muted:#536872;--border:#c8d7db}
header{padding:calc(18px + env(safe-area-inset-top)) 18px 16px;background:linear-gradient(135deg,var(--panel),var(--bg));border-bottom:1px solid var(--border);position:sticky;top:0;z-index:4}
.brand{display:flex;align-items:center;gap:12px}.logo{width:46px;height:46px;border-radius:13px;background:var(--accent);color:#102027;display:grid;place-items:center;font-size:25px;font-weight:900;box-shadow:0 4px 18px #0003}.brand h1{margin:0;font-size:22px}.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}
main{max-width:850px;margin:auto;padding:16px;}.hero{border:1px solid var(--border);background:linear-gradient(145deg,var(--panel2),var(--panel));padding:18px;border-radius:20px;margin-bottom:14px}.hero h2{margin:0 0 6px;font-size:23px}.hero p{margin:0;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}.stat{background:var(--panel);border:1px solid var(--border);padding:11px;border-radius:13px}.stat strong{display:block;font-size:20px}.stat span{font-size:11px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:15px;text-align:left;color:var(--text);min-height:105px;cursor:pointer}.tile .emoji{font-size:24px;display:block;margin-bottom:8px}.tile strong{display:block}.tile small{color:var(--muted)}button,input,select,textarea{font:inherit}button{cursor:pointer}.primary,.secondary,.danger{border:0;border-radius:11px;padding:10px 13px;font-weight:650}.primary{background:var(--accent);color:#102027}.secondary{background:var(--panel2);border:1px solid var(--border);color:var(--text)}.danger{background:#492c30;color:#ffdede}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0 12px}.section-title h2{margin:0;font-size:21px}.muted{color:var(--muted)}.card{background:var(--panel);border:1px solid var(--border);border-radius:15px;padding:14px;margin:10px 0}.card h3{margin:0 0 8px}.field{display:grid;gap:5px;margin:12px 0}.field label{color:var(--muted);font-size:13px}.field input,.field select,.field textarea,.search{width:100%;padding:11px 12px;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text)}.field textarea{min-height:90px;resize:vertical}.pill{display:inline-flex;border:1px solid var(--border);border-radius:999px;padding:4px 8px;color:var(--muted);font-size:12px}.check{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid var(--border)}.check:last-child{border-bottom:0}.check input{accent-color:var(--accent);width:19px;height:19px;margin-top:2px}.check.done .checktext{text-decoration:line-through;color:var(--muted)}details{background:var(--panel);border:1px solid var(--border);border-radius:14px;margin:10px 0;overflow:hidden}summary{padding:14px;font-weight:700;cursor:pointer;list-style:none}summary:after{content:"＋";float:right;color:var(--accent)}details[open] summary:after{content:"−"}details .inside{padding:0 14px 12px}.progress{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden;margin:9px 0}.progress div{height:100%;background:var(--accent);width:0%}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:5;background:var(--panel);border-top:1px solid var(--border);padding:8px 5px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);gap:3px}.bottom button{background:none;border:0;color:var(--muted);padding:5px 2px;font-size:11px}.bottom button span{display:block;font-size:20px;margin-bottom:2px}.bottom button.active{color:var(--accent);font-weight:800}.hidden{display:none!important}.item-title{font-weight:700}.item-meta{color:var(--muted);font-size:12px;margin-top:3px;overflow-wrap:anywhere}.fileline{display:flex;gap:10px;align-items:center;justify-content:space-between}.fileline>div{min-width:0}.fileline .item-title{overflow-wrap:anywhere}.note{background:var(--panel2);padding:10px 12px;border-radius:10px;color:var(--muted);font-size:13px}.tag{display:inline-block;background:var(--panel2);padding:3px 7px;border-radius:7px;margin:3px 3px 0 0;font-size:11px}.preview{border:1px solid var(--border);border-radius:15px;padding:14px;background:var(--panel);margin-top:10px}.swatches{display:flex;gap:8px;flex-wrap:wrap}.swatch{width:37px;height:37px;border-radius:50%;border:3px solid var(--border)}.swatch.selected{outline:3px solid var(--accent);outline-offset:2px}.empty{padding:25px;text-align:center;color:var(--muted)}a{color:var(--accent)}footer{text-align:center;color:var(--muted);font-size:11px;padding:25px 0 8px}
@media(min-width:650px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}.tile{min-height:135px}.bottom{left:50%;transform:translateX(-50%);max-width:850px;border:1px solid var(--border);border-bottom:0;border-radius:16px 16px 0 0}}
</style>
</head>
<body>
<header><div class="brand"><div class="logo">▦</div><div><h1 id="brandTitle">Minecraft HQ</h1><p id="brandSub">Your world. Your plans. Your progress.</p></div></div></header>
<main id="app"></main>
<nav class="bottom" aria-label="Main navigation">
<button data-page="home" class="active"><span>⌂</span>Home</button>
<button data-page="world"><span>🗺️</span>World</button>
<button data-page="checklists"><span>☑</span>Tasks</button>
<button data-page="library"><span>▣</span>Library</button>
<button data-page="settings"><span>⚙</span>Settings</button>
</nav>
<input type="file" id="restoreFile" accept="application/json,.json" class="hidden">
<script>
const KEY='minecraftHQ.v1';
const defaults={
 appName:'Minecraft HQ',theme:'Deep Dark',mode:'System',accent:'Cyan',layout:'Dashboard',
 seed:'6587673760855755824',baseX:'-993',baseZ:'-1130',
 checklists:[
 {id:'base',name:'Base essentials',icon:'🏠',tasks:[
  'Finish the main survival base shell','Build a secure entrance and lighting','Set up labelled storage categories','Create an enchanting area','Build an anvil and smithing corner','Add a Nether portal room','Make a bed, respawn point and emergency chest']},
 {id:'farms',name:'Essential farms',icon:'🌾',tasks:[
  'Basic crop farm','Sugar cane farm','Bamboo farm','Cactus farm','Pumpkin and melon farm','Mob / gunpowder farm','Iron farm','Villager breeder','Villager trading hall','XP farm','Gold farm','Raid farm (check current-version mechanics)','Wool farm','Honey and honeycomb farm']},
 {id:'automation',name:'Automation & storage',icon:'⚙️',tasks:[
  'Automatic smelter array','Bulk storage system','Item sorter for common drops','Crafter-based crafting factory','Super smelter fuel supply','Auto-composter for spare crops','Shulker box loading area']},
 {id:'builds',name:'Major builds',icon:'🏗️',tasks:[
  'Map room with explored regions','Nether hub and safe tunnels','Villager trading hall','Mega storage room','Enchanting library','Aquarium or axolotl habitat','Mountain or cliffside lookout','Custom village district','Main base landscaping','Hidden multiplayer prank room (keep it harmless)','Friend group meeting hall']},
 {id:'explore',name:'Exploration & progression',icon:'🧭',tasks:[
  'Locate an ancient city','Locate a stronghold','Find a village','Locate a trial chamber','Find a woodland mansion','Explore a Nether fortress','Find a bastion remnant','Visit an End city','Collect elytra','Collect shulker shells','Build a safe route to key structures']},
 {id:'optional',name:'Optional showpiece builds',icon:'✨',tasks:[
  'Secret piston door','Hidden underground base','Nether-themed trophy room','Pixel-art wall','Custom harbour or dock','Mini-game arena','Parkour course','Redstone puzzle room','Statue of a favourite mob','Observation tower']}
 ],
 structures:[
  {id:'ancient-city',name:'Ancient City',dimension:'Overworld',coords:'',status:'Not found',notes:''},
  {id:'stronghold',name:'Stronghold',dimension:'Overworld',coords:'',status:'Not found',notes:''},
  {id:'village',name:'Village',dimension:'Overworld',coords:'',status:'Not found',notes:''},
  {id:'trial-chamber',name:'Trial Chamber',dimension:'Overworld',coords:'',status:'Not found',notes:''},
  {id:'mansion',name:'Woodland Mansion',dimension:'Overworld',coords:'',status:'Not found',notes:''},
  {id:'fortress',name:'Nether Fortress',dimension:'Nether',coords:'',status:'Not found',notes:''},
  {id:'bastion',name:'Bastion Remnant',dimension:'Nether',coords:'',status:'Not found',notes:''},
  {id:'end-city',name:'End City',dimension:'End',coords:'',status:'Not found',notes:''}
 ],
 library:[], folders:['Tutorials','Maps','Build ideas','Notes'], customNotes:'', showDone:true
};
let data=load();
let page='home', searchTerm='', editItemId=null;
function clone(x){return JSON.parse(JSON.stringify(x))}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));return x?{...clone(defaults),...x}:clone(defaults)}catch(e){return clone(defaults)}}
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function themeColors(){
 let dark=data.mode==='Dark'||(data.mode==='System'&&!window.matchMedia('(prefers-color-scheme: light)').matches);
 if(data.mode==='Light')dark=false;
 const themes={
  'Deep Dark':dark?['#101820','#18242e','#22323e','#edf5f8','#a9bac5','#334752']:['#eef4f4','#ffffff','#e3eeee','#14232b','#536872','#c8d7db'],
  'Overworld':dark?['#142219','#1c3024','#294633','#f0f7ed','#b5ccb4','#3d5d45']:['#f0f7ed','#ffffff','#e2efdd','#1d3423','#55715a','#c6d9c0'],
  'Nether':dark?['#201313','#301c1c','#472727','#fff0e9','#d7b8ae','#593636']:['#fff1ec','#ffffff','#f4ddd5','#3b1e1b','#7b5a52','#e5c7bd']
 };
 let c=themes[data.theme]||themes['Deep Dark'];document.documentElement.style.setProperty('--bg',c[0]);document.documentElement.style.setProperty('--panel',c[1]);document.documentElement.style.setProperty('--panel2',c[2]);document.documentElement.style.setProperty('--text',c[3]);document.documentElement.style.setProperty('--muted',c[4]);document.documentElement.style.setProperty('--border',c[5]);
 document.body.classList.toggle('light',!dark);
 let accents={Cyan:'#49c9d7',Green:'#72d572',Orange:'#f07843',Purple:'#b28aff',Gold:'#f3c969',Red:'#ef6262',Blue:'#6ea8ff',Pink:'#f18acb'};
 document.documentElement.style.setProperty('--accent',accents[data.accent]||data.accent||'#49c9d7');
 document.querySelector('meta[name="theme-color"]').content=c[0];
 document.getElementById('brandTitle').textContent=data.appName||'Minecraft HQ';
}
function allTasks(){return data.checklists.flatMap(g=>g.tasks.map((t,i)=>({key:g.id+'_'+i,done:!!(data.completed||{})[g.id+'_'+i]})))}
function progress(){let a=allTasks(),n=a.filter(x=>x.done).length;return {n,total:a.length,p:a.length?Math.round(n/a.length*100):0}}
function shell(title,subtitle,body){return `<div class="section-title"><div><h2>${title}</h2>${subtitle?`<div class="muted">${subtitle}</div>`:''}</div></div>${body}`}
function home(){let p=progress(),found=data.structures.filter(s=>s.status==='Visited').length;
return `<section class="hero"><span class="pill">BEDROCK · PERSONAL WORLD</span><h2>Welcome to your command centre.</h2><p>One place for your world details, build queue, discoveries and tutorials. Your blocks, your rules.</p><div class="stats"><div class="stat"><strong>${p.p}%</strong><span>Tasks complete</span></div><div class="stat"><strong>${found}/${data.structures.length}</strong><span>Structures visited</span></div><div class="stat"><strong>${data.library.length}</strong><span>Library items</span></div></div><div class="progress"><div style="width:${p.p}%"></div></div><div class="row"><button class="primary" onclick="go('checklists')">Continue checklist →</button><button class="secondary" onclick="go('world')">Open world atlas</button></div></section>
<div class="tiles">
<button class="tile" onclick="go('world')"><span class="emoji">🗺️</span><strong>World Atlas</strong><small>Seed, base and maps</small></button>
<button class="tile" onclick="go('checklists')"><span class="emoji">☑️</span><strong>Mega Checklist</strong><small>${p.n} of ${p.total} tasks done</small></button>
<button class="tile" onclick="go('explore')"><span class="emoji">🧭</span><strong>Exploration</strong><small>Track structures</small></button>
<button class="tile" onclick="go('library')"><span class="emoji">📚</span><strong>My Library</strong><small>Files, links and notes</small></button>
<button class="tile" onclick="go('settings')"><span class="emoji">🎨</span><strong>Appearance</strong><small>${esc(data.theme)} · ${esc(data.accent)}</small></button>
<button class="tile" onclick="go('add')"><span class="emoji">＋</span><strong>Add something</strong><small>Save a link or note</small></button>
</div><div class="card"><h3>World quick facts</h3><div class="row"><span class="pill">Seed: ${esc(data.seed)}</span><span class="pill">X ${esc(data.baseX)}</span><span class="pill">Z ${esc(data.baseZ)}</span></div><p class="muted">Coordinates and seed are editable in World Atlas.</p></div>`;
}
function world(){return shell('World Atlas','Your Bedrock world reference',`
<div class="card"><h3>World details</h3><div class="field"><label>World seed</label><input id="seed" value="${esc(data.seed)}"></div><div class="row"><div class="field" style="flex:1"><label>Base X</label><input id="baseX" value="${esc(data.baseX)}"></div><div class="field" style="flex:1"><label>Base Z</label><input id="baseZ" value="${esc(data.baseZ)}"></div></div><div class="field"><label>World version / notes</label><textarea id="worldNotes" placeholder="Record your Bedrock version, base description, portal links, etc.">${esc(data.worldNotes||'')}</textarea></div><button class="primary" onclick="saveWorld()">Save world details</button></div>
<div class="card"><h3>Seed map shortcuts</h3><p class="muted">Open your seed in a map tool. Paste your seed there if it is not carried across automatically.</p><div class="row"><a class="primary" href="https://mcseedmap.net/" target="_blank" rel="noopener">Open Chunkbase-style map ↗</a><a class="secondary" href="https://www.chunkbase.com/apps/seed-map" target="_blank" rel="noopener">Chunkbase ↗</a></div><div class="field"><label>Saved map URL (optional)</label><input id="mapUrl" value="${esc(data.mapUrl||'')}" placeholder="Paste your specific seed-map link"></div><button class="secondary" onclick="saveMap()">Save map link</button>${data.mapUrl?`<p><a href="${esc(data.mapUrl)}" target="_blank" rel="noopener">Open my saved map ↗</a></p>`:''}</div>
<div class="card"><h3>Nether coordinate calculator</h3><p class="muted">Overworld X and Z divided by 8 gives the approximate Nether location.</p><div class="row"><span class="pill">Nether X ≈ ${Math.floor(Number(data.baseX)/8)}</span><span class="pill">Nether Z ≈ ${Math.floor(Number(data.baseZ)/8)}</span></div><p class="muted">Use this as a starting point; terrain and portal placement can shift the final connection.</p></div>`)}
function checklistPage(){let p=progress();let html=`<div class="card"><div class="row between"><div><strong>${p.n}/${p.total} tasks complete</strong><div class="muted">${p.p}% of the current checklist</div></div><button class="secondary" onclick="toggleDone()">${data.showDone?'Hide completed':'Show completed'}</button></div><div class="progress"><div style="width:${p.p}%"></div></div><div class="row"><button class="secondary" onclick="addGroup()">＋ New section</button><button class="secondary" onclick="resetProgress()">Reset checkboxes</button></div></div>`;
html+=data.checklists.map(g=>{let count=g.tasks.filter((t,i)=>(data.completed||{})[g.id+'_'+i]).length;return `<details open><summary>${g.icon||'☑️'} ${esc(g.name)} <span class="pill">${count}/${g.tasks.length}</span></summary><div class="inside">${g.tasks.map((t,i)=>{let key=g.id+'_'+i,done=!!(data.completed||{})[key];return data.showDone||!done?`<label class="check ${done?'done':''}"><input type="checkbox" ${done?'checked':''} onchange="toggleTask('${key}',this.checked)"><span class="checktext">${esc(t)}</span></label>`:''}).join('')}<div class="row"><button class="secondary" onclick="addTask('${g.id}')">＋ Add task</button><button class="secondary" onclick="renameGroup('${g.id}')">Rename section</button></div></div></details>`}).join('');
return shell('Mega Checklist','Expandable sections · progress is saved on this device',html)}
function explore(){return shell('Exploration Tracker','Record discoveries and coordinates',`<div class="row"><button class="primary" onclick="addStructure()">＋ Add structure</button><select id="structureFilter" class="search" style="width:auto" onchange="filterStructures(this.value)"><option>All</option><option>Not found</option><option>Located</option><option>Visited</option></select></div><div id="structureList">${structureCards('All')}</div>`)}
function structureCards(filter){return data.structures.filter(s=>filter==='All'||s.status===filter).map(s=>`<div class="card"><div class="row between"><div><h3>${esc(s.name)}</h3><span class="pill">${esc(s.dimension)}</span></div><select aria-label="Status" onchange="setStructure('${s.id}','status',this.value)">${['Not found','Located','Visited'].map(x=>`<option ${s.status===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Coordinates (X, Y, Z)</label><input value="${esc(s.coords)}" placeholder="e.g. 120, 32, -450" onchange="setStructure('${s.id}','coords',this.value)"></div><div class="field"><label>Notes</label><textarea onchange="setStructure('${s.id}','notes',this.value)" placeholder="Loot, route, portal, danger notes...">${esc(s.notes)}</textarea></div><button class="danger" onclick="deleteStructure('${s.id}')">Delete entry</button></div>`).join('')||'<div class="empty">No entries in this filter.</div>'}
function library(){let items=data.library.filter(x=>(x.name+' '+(x.tags||'')+' '+(x.folder||'')).toLowerCase().includes(searchTerm.toLowerCase()));return shell('My Library','Save links, notes, screenshots and reference files',`
<div class="row"><button class="primary" onclick="go('add')">＋ Add item</button><button class="secondary" onclick="document.getElementById('uploadFiles').click()">Upload files</button><input id="uploadFiles" type="file" multiple class="hidden" onchange="uploadFiles(this.files)"></div>
<div class="field"><label>Search library</label><input class="search" value="${esc(searchTerm)}" oninput="searchTerm=this.value;const y=window.scrollY;render();window.scrollTo(0,y)" placeholder="Search names, tags, folders..."></div>
<div class="row"><span class="pill">${data.library.length} items</span><span class="pill">${data.folders.length} folders</span><button class="secondary" onclick="addFolder()">＋ Folder</button></div>
${data.folders.length?`<div class="row" style="margin-top:10px">${data.folders.map(f=>`<button class="secondary" onclick="searchTerm='${esc(f).replace(/'/g,"\\'")}';go('library')">${esc(f)}</button>`).join('')}</div>`:''}
${items.map(x=>`<div class="card"><div class="fileline"><div><div class="item-title">${esc(x.name)}</div><div class="item-meta">${esc(x.type)} · ${esc(x.folder||'Unsorted')} ${x.tags?`· ${esc(x.tags)}`:''}</div></div><button class="secondary" onclick="deleteLibrary('${x.id}')">✕</button></div>${x.url?`<p><a href="${esc(x.url)}" target="_blank" rel="noopener">Open saved link ↗</a></p>`:''}${x.text?`<p>${esc(x.text)}</p>`:''}${x.dataUrl?`<p><a href="${x.dataUrl}" download="${esc(x.name)}">Open / download saved file ↗</a></p>`:''}</div>`).join('')||'<div class="empty">Nothing saved yet. Add a tutorial, note, map link or upload a file.</div>'}
<div class="note">Files are stored in this browser on this iPhone. Large files may use significant storage. Export a backup regularly.</div>`)}
function add(){return shell('Add to Library','Keep useful Minecraft information in one place',`<form class="card" id="addForm" onsubmit="event.preventDefault();addLibrary()"><div class="field"><label>Item name</label><input id="itemName" required placeholder="Iron farm tutorial"></div><div class="field"><label>Type</label><select id="itemType"><option>YouTube tutorial</option><option>Seed map</option><option>Note</option><option>Website</option><option>Build idea</option></select></div><div class="field"><label>Folder</label><select id="itemFolder">${data.folders.map(f=>`<option>${esc(f)}</option>`).join('')}<option>Unsorted</option></select></div><div class="field"><label>Tags (comma separated)</label><input id="itemTags" placeholder="farm, iron, tutorial"></div><div class="field"><label>URL (optional)</label><input id="itemUrl" type="url" placeholder="https://..."></div><div class="field"><label>Notes / description</label><textarea id="itemText" placeholder="Version notes, materials, build steps..."></textarea></div><button class="primary" type="submit">Save to library</button></form><div class="card"><h3>Upload files instead</h3><p class="muted">Images, PDFs and other files can be added from the Library tab. Files stay on this device unless you export a backup.</p><button class="secondary" onclick="go('library')">Open Library</button></div>`)}
function settings(){let swatches={Cyan:'#49c9d7',Green:'#72d572',Orange:'#f07843',Purple:'#b28aff',Gold:'#f3c969',Red:'#ef6262',Blue:'#6ea8ff',Pink:'#f18acb'};return shell('Settings','Change the app without changing your world',`
<div class="card"><h3>Appearance</h3><div class="field"><label>App name</label><input id="settingName" value="${esc(data.appName)}" onchange="data.appName=this.value;save()"></div><div class="field"><label>Theme</label><select id="settingTheme" onchange="data.theme=this.value;save()">${['Overworld','Deep Dark','Nether'].map(t=>`<option ${data.theme===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label>Appearance mode</label><select onchange="data.mode=this.value;save()">${[['System','Follow iPhone appearance'],['Dark','Always dark'],['Light','Always light']].map(([v,l])=>`<option value="${v}" ${data.mode===v?'selected':''}>${l}</option>`).join('')}</select></div><div class="field"><label>Accent colour</label><div class="swatches">${Object.entries(swatches).map(([n,c])=>`<button title="${n}" aria-label="${n}" class="swatch ${data.accent===n?'selected':''}" style="background:${c}" onclick="data.accent='${n}';save()"></button>`).join('')}</div><div class="muted">Selected: ${esc(data.accent)}</div></div><div class="field"><label>Home layout</label><select onchange="data.layout=this.value;save()">${[['Dashboard','Visual dashboard'],['Compact','Compact list'],['Map-first','Map-first']].map(([v,l])=>`<option value="${v}" ${data.layout===v?'selected':''}>${l}</option>`).join('')}</select></div><div class="preview"><strong>Live theme preview</strong><div class="row" style="margin-top:10px"><span class="pill">${esc(data.theme)}</span><span class="pill">${esc(data.mode)}</span><span class="pill">${esc(data.accent)}</span></div><div class="progress"><div style="width:68%"></div></div><button class="primary">Example accent button</button></div><p><button class="secondary" onclick="resetAppearance()">Restore default appearance</button></p></div>
<div class="card"><h3>Backup & restore</h3><p class="muted">Export settings, checklist progress, structures, library notes and saved files into a JSON backup. Keep backups somewhere safe.</p><div class="row"><button class="primary" onclick="exportBackup()">Export backup</button><button class="secondary" onclick="document.getElementById('restoreFile').click()">Restore backup</button></div><p class="muted">Restoring replaces the current app data. Export first if you want to keep a copy.</p></div>
<div class="card"><h3>Data storage</h3><p>Storage: <strong>On this device</strong></p><p class="muted">This first version uses this browser's local storage. Clearing Safari website data may erase your saved information. Keep regular backups.</p><button class="danger" onclick="wipeAll()">Delete all app data</button></div>`)}
function render(){themeColors();document.querySelectorAll('.bottom button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let app=document.getElementById('app');let views={home,world,checklists:checklistPage,explore,library,settings,add};app.innerHTML=(views[page]||home)()+`<footer>Minecraft HQ · Local-first build · Back up your world notes regularly</footer>`}
function go(p){page=p;searchTerm='';render();window.scrollTo(0,0)}
document.querySelectorAll('.bottom button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
function saveWorld(){data.seed=document.getElementById('seed').value;data.baseX=document.getElementById('baseX').value;data.baseZ=document.getElementById('baseZ').value;data.worldNotes=document.getElementById('worldNotes').value;save();alert('World details saved.')}
function saveMap(){data.mapUrl=document.getElementById('mapUrl').value;save();alert('Map shortcut saved.')}
function toggleTask(key,v){data.completed=data.completed||{};data.completed[key]=v;localStorage.setItem(KEY,JSON.stringify(data));render()}
function toggleDone(){data.showDone=!data.showDone;save()}
function resetProgress(){if(confirm('Reset all checklist checkboxes? Your tasks and notes will remain.')){data.completed={};save()}}
function addTask(id){let t=prompt('New checklist task:');if(!t)return;let g=data.checklists.find(x=>x.id===id);if(g){g.tasks.push(t);save()}}
function addGroup(){let n=prompt('New checklist section name:');if(!n)return;let id='custom_'+Date.now();data.checklists.push({id,name:n,icon:'📌',tasks:[]});save()}
function renameGroup(id){let g=data.checklists.find(x=>x.id===id);if(!g)return;let n=prompt('Section name:',g.name);if(n){g.name=n;save()}}
function addStructure(){let name=prompt('Structure name:');if(!name)return;data.structures.push({id:'s_'+Date.now(),name,dimension:'Overworld',coords:'',status:'Not found',notes:''});save()}
function setStructure(id,k,v){let s=data.structures.find(x=>x.id===id);if(s){s[k]=v;localStorage.setItem(KEY,JSON.stringify(data));if(k==='status')render()}}
function deleteStructure(id){if(confirm('Delete this exploration entry?')){data.structures=data.structures.filter(x=>x.id!==id);save()}}
function filterStructures(v){document.getElementById('structureList').innerHTML=structureCards(v)}
function addFolder(){let f=prompt('New folder name:');if(f&&!data.folders.includes(f)){data.folders.push(f);save()}}
function addLibrary(){let x={id:'l_'+Date.now(),name:document.getElementById('itemName').value,type:document.getElementById('itemType').value,folder:document.getElementById('itemFolder').value,tags:document.getElementById('itemTags').value,url:document.getElementById('itemUrl').value,text:document.getElementById('itemText').value};data.library.unshift(x);save();go('library')}
function deleteLibrary(id){if(confirm('Delete this library item?')){data.library=data.library.filter(x=>x.id!==id);save()}}
function uploadFiles(files){Array.from(files||[]).forEach(file=>{let reader=new FileReader();reader.onload=()=>{data.library.unshift({id:'f_'+Date.now()+'_'+Math.random().toString(16).slice(2),name:file.name,type:'Uploaded file',folder:'Unsorted',tags:'upload',text:`${file.type||'File'} · ${Math.round(file.size/1024)} KB`,dataUrl:reader.result});try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){alert('This file is too large for browser storage. Try a smaller file.');return}render()};reader.readAsDataURL(file)});page='library'}
function resetAppearance(){if(confirm('Reset appearance to Deep Dark, System mode, Cyan accent and Dashboard layout?')){data.appName='Minecraft HQ';data.theme='Deep Dark';data.mode='System';data.accent='Cyan';data.layout='Dashboard';save()}}
function exportBackup(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='minecraft-hq-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(url)}
document.getElementById('restoreFile').addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.checklists||!x.structures||!x.library)throw Error('not a Minecraft HQ backup');if(confirm('Replace current app data with this backup?')){data={...clone(defaults),...x};save();alert('Backup restored.')}}catch(err){alert('Could not restore this backup. Check that it is a Minecraft HQ JSON backup.')}e.target.value=''};r.readAsText(f)});
function wipeAll(){if(confirm('Delete ALL Minecraft HQ data from this browser? Export a backup first if needed.')){localStorage.removeItem(KEY);data=clone(defaults);save()}}
if('serviceWorker' in navigator && location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
if(window.matchMedia){window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if(data.mode==='System')themeColors()})}
render();
</script>
</body>
</html>
